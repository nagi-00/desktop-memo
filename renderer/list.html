<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메모 목록</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/list.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<div class="list-root">

  <!-- 타이틀바 -->
  <div class="list-titlebar">
    <h1 class="list-title">메모 목록</h1>
    <input
      type="search"
      class="search-input"
      id="searchInput"
      placeholder="검색..."
      autocomplete="off"
    />
    <button class="btn-new-memo" id="btnNewMemo">
      <i data-lucide="plus" width="12" height="12"></i>
      새 메모
    </button>
    <!-- Sticky Notes 모드 -->
    <button class="btn-tray-list" id="btnStickyNotes" title="Sticky Notes처럼 사용하기">
      <i data-lucide="sticky-note" width="14" height="14"></i>
    </button>
    <!-- 내보내기 -->
    <button class="btn-tray-list" id="btnExport" title="메모 백업 저장 (JSON)">
      <i data-lucide="download" width="14" height="14"></i>
    </button>
    <!-- 단축키 도움말 -->
    <button class="btn-tray-list" id="btnShortcutHelp" title="단축키 도움말">
      <i data-lucide="keyboard" width="14" height="14"></i>
    </button>
    <!-- 트레이로 최소화 -->
    <button class="btn-tray-list" id="btnTrayList" title="트레이로 최소화">
      <i data-lucide="minus" width="14" height="14"></i>
    </button>
    <button class="btn-close-list" id="btnClose" title="닫기">
      <i data-lucide="x" width="14" height="14"></i>
    </button>
  </div>

  <!-- 필터 바 -->
  <div class="filter-bar">
    <button class="filter-chip active" data-filter="all">전체</button>
    <button class="filter-chip" data-filter="liked">
      <i data-lucide="heart" width="11" height="11"></i>
      좋아요
    </button>
    <button class="filter-chip" data-filter="threads">
      <i data-lucide="messages-square" width="11" height="11"></i>
      스레드
    </button>
    <button class="filter-chip" data-filter="trash">
      <i data-lucide="trash-2" width="11" height="11"></i>
      휴지통
    </button>
    <!-- 태그 필터 칩 (JS로 동적 추가) -->
    <div class="tag-filter-chips" id="tagFilterChips"></div>
  </div>

  <!-- 태그 추가 인라인 입력 (선택된 메모에서 표시) -->
  <div class="tag-add-bar" id="tagAddBar" style="display:none">
    <span class="tag-add-label">태그:</span>
    <div class="tag-add-chips" id="tagAddChips"></div>
    <input type="text" class="tag-add-input" id="tagAddInput" placeholder="태그 추가 후 Enter..." maxlength="20" autocomplete="off" />
  </div>

  <!-- 본체 -->
  <div class="list-body">
    <!-- 좌측: 메모 목록 -->
    <div class="list-sidebar" id="memoListSidebar">
      <div class="empty-list" id="emptyList" style="display:none">
        <i data-lucide="file-text" width="32" height="32"></i>
        <span>메모가 없습니다</span>
      </div>
      <!-- 항목은 JS로 렌더링 -->
    </div>

    <!-- 드래그 리사이즈 핸들 -->
    <div class="list-resize-handle" id="listResizeHandle"></div>

    <!-- 우측: 미리보기 -->
    <div class="list-preview" id="previewPane">
      <div class="preview-empty" id="previewEmpty">
        <i data-lucide="mouse-pointer-click" width="32" height="32"></i>
        <span>메모를 선택하세요</span>
      </div>
      <!-- 미리보기 내용은 JS로 렌더링 -->
    </div>
  </div>

</div>

<!-- 단축키 도움말 오버레이 -->
<div class="shortcut-overlay" id="shortcutOverlay">
  <div class="shortcut-box">
    <div class="shortcut-box-header">
      <span>단축키 & 도움말</span>
      <button id="shortcutClose">×</button>
    </div>
    <div class="shortcut-box-body">
      <div class="shortcut-section">
        <div class="shortcut-section-title">메모 창</div>
        <div class="shortcut-row"><kbd>Ctrl+N</kbd><span>새 메모 만들기</span></div>
        <div class="shortcut-row"><kbd>Ctrl+B</kbd><span>굵게</span></div>
        <div class="shortcut-row"><kbd>Ctrl+I</kbd><span>기울임</span></div>
        <div class="shortcut-row"><kbd>Ctrl+U</kbd><span>밑줄</span></div>
        <div class="shortcut-row"><kbd>Ctrl+Shift+X</kbd><span>취소선</span></div>
        <div class="shortcut-row"><kbd>Ctrl+Shift+H</kbd><span>하이라이트</span></div>
        <div class="shortcut-row"><kbd>Ctrl+K</kbd><span>링크 삽입</span></div>
        <div class="shortcut-row"><kbd>Ctrl+Z</kbd><span>실행 취소</span></div>
        <div class="shortcut-row"><kbd>Ctrl+Y</kbd><span>다시 실행</span></div>
      </div>
      <div class="shortcut-section">
        <div class="shortcut-section-title">자동 변환 (스페이스 입력 시)</div>
        <div class="shortcut-row"><kbd>- 또는 *</kbd><span>글머리 목록</span></div>
        <div class="shortcut-row"><kbd>1.</kbd><span>번호 목록</span></div>
        <div class="shortcut-row"><kbd>[]</kbd><span>체크박스</span></div>
        <div class="shortcut-row"><kbd>---</kbd><span>구분선</span></div>
      </div>
      <div class="shortcut-section">
        <div class="shortcut-section-title">우클릭 메뉴</div>
        <div class="shortcut-row"><span style="min-width:90px">텍스트 선택 후</span><span>서식 / 글자색 / 링크 / 하이라이트</span></div>
        <div class="shortcut-row"><span style="min-width:90px">아바타 우클릭</span><span>프로필 저장 / 불러오기</span></div>
      </div>
      <div class="shortcut-version">Desktop Memo · 오픈소스 프로젝트</div>
    </div>
  </div>
</div>

<script type="module" src="list.js"></script>
</body>
</html>
