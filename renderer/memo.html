<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/memo.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<div class="memo-root" id="memoRoot">

  <!-- ══════════════════════════════════
       CARD VIEW (기본 상태)
  ══════════════════════════════════ -->
  <div class="card-view" id="cardView">

    <!-- ── 카드 본체 ── -->
    <div class="memo-card">
      <!-- 간단히 보기 모드 드래그 핸들 + 복원 버튼 -->
      <div class="simple-drag-strip" id="simpleDragStrip"></div>
      <button class="simple-restore-btn" id="btnRestoreDetail" title="자세히 보기">
        <i data-lucide="eye" width="11" height="11"></i>
      </button>

      <!-- ── 상태바 (상단 고정) ── -->
      <div class="status-bar" id="statusBar">
        <div class="status-bar-inner">

          <!-- 핀 -->
          <button class="sb-btn" id="btnPin" title="항상 위 고정">
            <i data-lucide="pin" width="13" height="13"></i>
          </button>

          <!-- 투명도 -->
          <div class="sb-popup-wrap" id="opacityWrap">
            <button class="sb-btn" id="btnOpacity" title="투명도 조절">
              <i data-lucide="droplets" width="13" height="13"></i>
            </button>
            <div class="sb-popup opacity-popup" id="opacityPopup">
              <span class="popup-label">투명도</span>
              <input type="range" id="opacitySlider" min="0.1" max="1" step="0.01" value="1" />
              <span id="opacityValue">100%</span>
            </div>
          </div>

          <!-- 숨기기 -->
          <button class="sb-btn" id="btnMinimize" title="목록에 숨기기 (창 닫기)">
            <i data-lucide="minimize-2" width="13" height="13"></i>
          </button>

          <!-- 다크/라이트 토글 -->
          <button class="sb-btn" id="btnThemeToggle" title="다크/라이트 모드 전환">
            <i data-lucide="sun" width="13" height="13"></i>
          </button>

          <!-- 컬러 테마 -->
          <div class="sb-popup-wrap" id="colorWrap">
            <button class="sb-color-dot" id="colorDot" title="테마 색상 변경"></button>
            <div class="sb-popup color-popup" id="colorPopup">
              <div class="color-swatches" id="colorSwatches"></div>
            </div>
          </div>

          <div class="sb-spacer"></div>

          <!-- 간단히 보기 -->
          <button class="sb-btn" id="btnSimpleView" title="간단히 보기">
            <i data-lucide="eye-off" width="13" height="13"></i>
          </button>

          <!-- 잠금 (클릭 차단) -->
          <button class="sb-btn" id="btnLock" title="잠금 (클릭 차단)">
            <i data-lucide="lock-open" width="13" height="13"></i>
          </button>

          <!-- 삭제 -->
          <button class="sb-btn delete" id="btnDelete" title="메모 삭제">
            <i data-lucide="trash-2" width="13" height="13"></i>
          </button>

        </div>
      </div>

      <!-- 답글 컨텍스트 (부모 메모가 있을 때 표시) -->
      <div class="reply-context" id="replyContext" style="display:none">
        <span class="reply-context-icon">↩</span>
        <span class="reply-context-text" id="replyContextText"></span>
        <button class="reply-apply-parent-theme" id="btnApplyParentTheme" title="원본 테마 적용" style="display:none">원본 테마 적용</button>
      </div>

      <!-- 프로필 행 (drag region) -->
      <div class="profile-row" id="profileRow">
        <div class="avatar" id="profileAvatar"></div>
        <div class="profile-info">
          <div class="profile-top">
            <span
              class="display-name"
              id="displayName"
              contenteditable="true"
              spellcheck="false"
              role="textbox"
              aria-label="표시 이름"
            >메모</span>
            <span
              class="handle"
              id="handleText"
              contenteditable="true"
              spellcheck="false"
              role="textbox"
              aria-label="핸들"
            >@note</span>
            <span class="profile-badge" id="profileBadge">
              <i data-lucide="check" width="9" height="9"></i>
            </span>
          </div>
        </div>
        <!-- 우측: 심볼 아이콘 (메모 목록 열기) — Phase 3에서 선택 가능 -->
        <button class="symbol-btn" id="symbolBtn" title="메모 목록 열기">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
            <path d="M12 21.638h-.014C9.403 21.59 1.95 14.856 1.95 8.478c0-3.064 2.525-5.754 5.403-5.754 2.29 0 3.83 1.58 4.646 2.73.814-1.148 2.354-2.73 4.645-2.73 2.88 0 5.404 2.69 5.404 5.755 0 6.376-7.454 13.11-10.037 13.157H12z"/>
          </svg>
        </button>
      </div>

      <!-- 본문 -->
      <div class="memo-body">
        <div
          class="memo-content"
          id="memoContent"
          contenteditable="true"
          spellcheck="false"
          data-placeholder="메모를 입력하세요..."
        ></div>
        <!-- 미디어 헤더 (접기/펼치기) -->
        <div class="media-header" id="mediaHeader" style="display:none">
          <button class="media-fold-btn" id="btnMediaFold">
            <i data-lucide="image" width="11" height="11"></i>
            <span id="mediaFoldLabel">이미지 접기</span>
            <i data-lucide="chevron-up" id="mediaFoldIcon" width="11" height="11"></i>
          </button>
        </div>
        <!-- 미디어 영역 (트위터처럼 텍스트 아래 고정) -->
        <div class="media-area" id="mediaArea"></div>
      </div>

      <!-- 액션 바 -->
      <div class="action-bar">
        <span class="created-date" id="createdDate"></span>
        <!-- 버튼 영역 (overflow:hidden — 팝업 없는 버튼만) -->
        <div class="action-icons">
          <button class="action-icon-btn reply"      id="btnReply"      title="답글">
            <i data-lucide="message-circle" width="15" height="15"></i>
          </button>
          <button class="action-icon-btn thread-fold" id="btnThreadFold" title="답글 스레드 접기/펼치기">
            <i data-lucide="chevrons-up-down" width="15" height="15"></i>
          </button>
          <!-- 글꼴 설정 (액션바) -->
          <div class="action-popup-wrap" id="fontWrap">
            <button class="action-icon-btn font" id="btnFont" title="글꼴 설정">
              <i data-lucide="a-large-small" width="15" height="15"></i>
            </button>
            <div class="action-popup font-popup" id="fontPopup">
              <input type="text" class="font-search" id="fontSearch" placeholder="폰트 검색..." />
              <div class="font-families" id="fontFamilies"></div>
              <div class="font-size-row">
                <span class="popup-label">크기</span>
                <input type="range" id="fontSizeSlider" min="10" max="24" step="1" value="14" />
                <span id="fontSizeValue">14px</span>
              </div>
            </div>
          </div>
          <button class="action-icon-btn image"      id="btnImage"      title="이미지 첨부">
            <i data-lucide="image" width="15" height="15"></i>
          </button>
          <button class="action-icon-btn like"       id="btnLike"       title="좋아요">
            <i data-lucide="heart" width="15" height="15"></i>
          </button>
          <button class="action-icon-btn new-memo"   id="btnNewMemo"    title="새 메모 (Ctrl+N)">
            <i data-lucide="plus" width="15" height="15"></i>
          </button>
        </div>
        <!-- 캡처 팝업 래퍼 — action-icons 밖으로 분리 (overflow:hidden 영향 안 받음) -->
        <div class="action-popup-wrap" id="captureWrap">
          <button class="action-icon-btn capture" id="btnCapture" title="이미지로 내보내기">
            <i data-lucide="camera" width="15" height="15"></i>
          </button>
          <div class="action-popup capture-popup" id="capturePopup">
            <button class="capture-opt" id="btnCaptureClipboard">
              <i data-lucide="clipboard" width="13" height="13"></i>
              클립보드 복사
            </button>
            <button class="capture-opt" id="btnCaptureSave">
              <i data-lucide="download" width="13" height="13"></i>
              파일로 저장
            </button>
          </div>
        </div>
      </div>

    </div><!-- /.memo-card -->

  </div><!-- /.card-view -->

</div><!-- /.memo-root -->

<!-- 링크 삽입 다이얼로그 -->
<div class="link-dialog-overlay" id="linkDialogOverlay">
  <div class="link-dialog-box">
    <div class="link-dialog-label">링크 URL</div>
    <input type="url" id="linkDialogInput" placeholder="https://" autocomplete="off" spellcheck="false" />
    <div class="link-dialog-btns">
      <button id="linkDialogCancel">취소</button>
      <button id="linkDialogConfirm" class="primary">삽입</button>
    </div>
  </div>
</div>

<!-- 프로필 불러오기 팝업 -->
<div class="profile-load-overlay" id="profileLoadOverlay">
  <div class="profile-load-box">
    <div class="profile-load-header">
      <span>저장된 프로필</span>
      <button id="profileLoadClose">×</button>
    </div>
    <div class="profile-load-list" id="profileLoadList"></div>
  </div>
</div>

<!-- 이미지 편집 모달 -->
<div class="img-editor-overlay" id="imgEditorOverlay">
  <div class="img-editor-dialog">
    <div class="img-editor-header">
      <span>이미지 편집</span>
      <button class="img-editor-close" id="imgEditorClose">×</button>
    </div>
    <div class="img-editor-canvas-wrap">
      <canvas id="imgEditorCanvas"></canvas>
      <div class="img-editor-circle-overlay" id="imgEditorCircleOverlay"></div>
    </div>
    <div class="img-editor-controls">
      <div class="img-editor-row">
        <button class="img-editor-btn" id="imgFlipH"     title="좌우 반전">↔</button>
        <button class="img-editor-btn" id="imgFlipV"     title="상하 반전">↕</button>
        <button class="img-editor-btn" id="imgResetTransform" title="초기화" style="margin-left:auto">↩</button>
      </div>
      <div class="img-editor-row slider-row">
        <label>크기</label>
        <input type="range" id="imgScale" min="20" max="400" value="100" step="5">
        <span id="imgScaleVal">100%</span>
      </div>
      <div class="img-editor-row slider-row">
        <label>회전</label>
        <input type="range" id="imgRotateSlider" min="-180" max="180" value="0" step="1">
        <span id="imgRotateVal">0°</span>
      </div>
    </div>
    <div class="img-editor-footer">
      <button class="img-editor-btn cancel" id="imgEditorReset" title="원본 이미지로 초기화">초기화</button>
      <button class="img-editor-btn cancel" id="imgEditorCancel">취소</button>
      <button class="img-editor-btn apply" id="imgEditorApply">적용</button>
    </div>
  </div>
</div>

<!-- 숨겨진 파일 인풋 -->
<input type="file" id="imageFileInput" accept="image/*" multiple style="display:none">
<input type="file" id="avatarFileInput" accept="image/*" style="display:none">
<input type="color" id="textColorInput" style="display:none" value="#f87171">
<input type="color" id="colorPickerCustom" style="display:none" title="커스텀 색상" />

<script type="module" src="memo.js"></script>
</body>
</html>
